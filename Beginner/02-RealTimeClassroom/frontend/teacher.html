<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher — Quiz Buzzer</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        (function () {
            var t = localStorage.getItem("qb-theme") ||
                (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
</head>

<body data-lang="ar">
    <header class="topbar">
        <a class="topbar__brand" href="index.html" data-i18n="brand">بازر الكويز</a>
        <div class="topbar__controls">
            <button id="langToggle" class="pill-btn">EN / AR</button>
            <button id="themeToggle" class="pill-btn">🌙</button>
        </div>
    </header>

    <main class="teacher">
        <h1 data-i18n="teacherTitle">لوحة المعلم — الترتيب</h1>
        <ol id="rankingList" class="ranking-list"></ol>
        <p id="rankingEmpty" class="ranking-empty" data-i18n="rankingEmpty">لا يوجد متسابقون بعد</p>
        <button id="resetBtn" class="cta" data-i18n="resetBtn">جولة جديدة</button>
    </main>

    <script src="./i18n.js"></script>
    <script src="./theme.js"></script>
    <script type="module" src="./dist/teacher-client.js"></script>
</body>

</html>
